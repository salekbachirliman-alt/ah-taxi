<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="SH Taxi — movilidad local, sencilla y clara.">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>SH Taxi</title>
<style>
:root{color-scheme:light;--ink:#141414;--muted:#70757a;--red:#d92d3a;--green:#16834b;--surface:#fff;--shadow:0 8px 30px #17212b20}
*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#e8edef}
button{font:inherit;cursor:pointer;border:0}#map{position:fixed;inset:0;z-index:1;background:#e8edef}.leaflet-control-attribution{font-size:9px!important}
.topbar{position:fixed;z-index:500;top:calc(env(safe-area-inset-top) + 14px);left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand,.mode-switch,.locate{pointer-events:auto;box-shadow:var(--shadow);background:var(--surface)}
.brand{display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:16px;font-size:20px;font-weight:950;letter-spacing:-.8px}.brand-mark{width:9px;height:25px;background:var(--red);border-radius:6px;display:inline-block}.brand span:last-child{color:var(--red)}
.mode-switch{display:flex;padding:4px;border-radius:14px;gap:3px}.mode-switch button{padding:10px 12px;border-radius:10px;background:transparent;font-size:12px;font-weight:800;color:#555}.mode-switch button[aria-pressed="true"]{background:var(--ink);color:white}
.locate{position:fixed;z-index:500;right:16px;bottom:calc(176px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:22px}
.sheet{position:fixed;z-index:600;left:0;right:0;bottom:0;min-height:126px;padding:10px 20px calc(env(safe-area-inset-bottom) + 16px);background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -8px 34px #11111118}.handle{width:42px;height:5px;border-radius:8px;background:#d9dcdf;margin:0 auto 17px}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:16px}.sheet-title{font-size:18px;font-weight:850;letter-spacing:-.3px}.sheet-caption{font-size:12px;color:var(--muted);margin-top:4px}.online-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:7px}.status{font-size:11px;font-weight:800;color:var(--green);white-space:nowrap}.toast{position:fixed;z-index:1000;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 78px);padding:13px 15px;border-radius:14px;background:#171717;color:white;box-shadow:var(--shadow);font-size:13px}.toast[hidden]{display:none}
@media(min-width:720px){.topbar{left:24px;right:24px;top:24px}.sheet{left:auto;right:20px;bottom:20px;width:390px;border-radius:26px;padding:12px 22px 24px}.locate{right:430px;bottom:40px}.toast{left:auto;right:430px;top:24px;max-width:360px}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Mapa interactivo de SH Taxi"></div>
<header class="topbar">
  <div class="brand" aria-label="SH Taxi"><i class="brand-mark"></i><span>SH</span><span>TAXI</span></div>
  <nav class="mode-switch" aria-label="Tipo de acceso">
    <button id="passengerMode" aria-pressed="true">Pasajero</button>
    <button id="driverMode" aria-pressed="false">Conductor</button>
  </nav>
</header>
<button class="locate" id="locateMe" aria-label="Centrar mapa en mi ubicación" title="Mi ubicación">◎</button>
<div class="toast" id="toast" role="status" hidden></div>
<section class="sheet" aria-label="Panel principal">
  <div class="handle"></div>
  <div class="sheet-head">
    <div><div class="sheet-title" id="sheetTitle">¿A dónde vamos?</div><div class="sheet-caption" id="sheetCaption">Tu ciudad, tus viajes, más fácil.</div></div>
    <div class="status"><i class="online-dot"></i>SH TAXI</div>
  </div>
</section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=> {
  const map=L.map("map",{zoomControl:false,preferCanvas:true}).setView([38.477,-0.791],12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
  L.control.zoom({position:"bottomright"}).addTo(map);
  let userMarker=null,accuracyCircle=null;
  const toast=document.getElementById("toast");
  function showToast(message){toast.textContent=message;toast.hidden=false;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.hidden=true,3600)}
  document.getElementById("locateMe").addEventListener("click",()=>{
    if(!navigator.geolocation){showToast("Este navegador no permite acceder a la ubicación.");return}
    showToast("Buscando tu ubicación…");
    navigator.geolocation.getCurrentPosition(position=>{
      const lat=position.coords.latitude,lon=position.coords.longitude;
      map.flyTo([lat,lon],16,{duration:.7});
      if(userMarker)map.removeLayer(userMarker);
      if(accuracyCircle)map.removeLayer(accuracyCircle);
      accuracyCircle=L.circle([lat,lon],{radius:Math.max(position.coords.accuracy||30,20),color:"#16834b",weight:1,fillColor:"#16834b",fillOpacity:.10}).addTo(map);
      userMarker=L.circleMarker([lat,lon],{radius:8,color:"#fff",weight:3,fillColor:"#16834b",fillOpacity:1}).addTo(map).bindPopup("Tu ubicación");
      showToast("Mapa centrado en tu ubicación.");
    },()=>showToast("No se pudo obtener tu ubicación. Revisa los permisos de Safari."),{enableHighAccuracy:true,timeout:15000,maximumAge:10000});
  });
  function setMode(mode){
    const passenger=mode==="passenger";
    document.getElementById("passengerMode").setAttribute("aria-pressed",String(passenger));
    document.getElementById("driverMode").setAttribute("aria-pressed",String(!passenger));
    document.getElementById("sheetTitle").textContent=passenger?"¿A dónde vamos?":"Tu espacio de conductor";
    document.getElementById("sheetCaption").textContent=passenger?"Tu ciudad, tus viajes, más fácil.":"Disponibilidad y solicitudes aparecerán aquí.";
    showToast(passenger?"Vista de pasajero seleccionada.":"Vista de conductor seleccionada.");
  }
  document.getElementById("passengerMode").addEventListener("click",()=>setMode("passenger"));
  document.getElementById("driverMode").addEventListener("click",()=>setMode("driver"));
  window.addEventListener("resize",()=>map.invalidateSize());
  if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
})();
</script>
</body>
</html>
